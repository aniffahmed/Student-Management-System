# ------------------------------------------------------------
# Application basic settings
# ------------------------------------------------------------
spring.application.name=student-management-system
server.port=8080

# ------------------------------------------------------------
# Embedded H2 datasource settings
# Database file: ./data/studentdb
# ------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/studentdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ------------------------------------------------------------
# JPA / Hibernate settings
# update = create table automatically and update schema if needed
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
